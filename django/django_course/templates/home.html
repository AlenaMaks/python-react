{% extends 'layout.html' %}

{% block title %} Главная {% endblock %}

{% block content %}
<h1>Главная страница</h1>
<p>Сайт компании.</p>

<h2>Последние новости</h2>

{% for news in latest_news %}

<div>
    <h3>{{ news.title }}</h3>
    <p> Автор: {{ news.author }} </p>
    <p> {{ news.created_at }} </p>
</div>
<hr>
{% endfor %}
{% endblock %}
