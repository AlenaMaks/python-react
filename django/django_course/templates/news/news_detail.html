{% extends 'layout.html' %}

{% block title %}
{{ news.title }}
{% endblock %}

{% block content %}

<h1>{{ news.title }}</h1>

<p>
    Автор: {{ news.author }}
</p>

<p>
    Дата публикации: {{ news.created_at }}
</p>

{% if news.image_url %}
<img
    src="{{ news.image_url }}"
    width="500"
>
{% endif %}

<p>
    {{ news.content }}
</p>

{% endblock %}
